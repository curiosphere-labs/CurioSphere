name: Publish CurioSphere Articles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/articles/**"
      - "1. scripts/**"
      - ".github/workflows/publish-articles.yml"

permissions:
  contents: write

concurrency:
  group: curiosphere-publishing
  cancel-in-progress: false

jobs:
  build:
    name: Validate, Generate and Publish Articles
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate article metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          article_dir = Path("content/articles")

          if not article_dir.exists():
              sys.exit("ERROR: content/articles directory not found.")

          files = list(article_dir.glob("*.md"))

          if not files:
              print("No Markdown article files found.")
              sys.exit(0)

          errors = []

          for file in files:
              content = file.read_text(encoding="utf-8")

              if not content.startswith("---\n"):
                  errors.append(f"{file}: missing YAML frontmatter")
                  continue

              parts = content.split("---", 2)

              if len(parts) < 3:
                  errors.append(f"{file}: invalid frontmatter")
                  continue

              metadata = parts[1]

              for field in ("title", "description", "category", "status"):
                  if not re.search(
                      rf"(?m)^{re.escape(field)}\s*:",
                      metadata
                  ):
                      errors.append(f"{file}: missing {field}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(files)} article file(s).")
          PY

      - name: Generate published article pages
        run: python "1. scripts/build_articles.py"

      - name: Verify generated website files
        run: |
          test -f articles-index.json || {
            echo "ERROR: articles-index.json was not generated."
            exit 1
          }

          python -m json.tool articles-index.json > /dev/null

          echo "Generated article index:"
          cat articles-index.json

      - name: Publish generated files to GitHub Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f articles/ articles-index.json

          if git diff --cached --quiet; then
            echo "No generated article changes to publish."
          else
            git commit -m "Publish generated CurioSphere articles"
            git push origin HEAD:main
          fi
