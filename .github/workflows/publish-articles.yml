name: Publish CurioSphere Articles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/articles/**"
      - "scripts/**"
      - ".github/workflows/publish-articles.yml"

permissions:
  contents: read

concurrency:
  group: curiosphere-publishing
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate article files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate article metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          article_dir = Path("content/articles")

          if not article_dir.exists():
              print("No content/articles directory found.")
              sys.exit(1)

          files = list(article_dir.glob("*.md"))

          if not files:
              print("No Markdown article files found.")
              sys.exit(0)

          errors = []

          for file in files:
              content = file.read_text(encoding="utf-8")

              if not content.startswith("---"):
                  errors.append(f"{file}: missing YAML front matter")
                  continue

              parts = content.split("---", 2)

              if len(parts) < 3:
                  errors.append(f"{file}: invalid front matter")
                  continue

              metadata = parts[1]

              for field in ("title:", "description:", "category:", "status:"):
                  if field not in metadata:
                      errors.append(f"{file}: missing {field}")

              print(f"Checked: {file}")

          if errors:
              print("\nValidation errors:")
              for error in errors:
                  print("-", error)
              sys.exit(1)

          print("\nArticle metadata validation completed.")
          PY
